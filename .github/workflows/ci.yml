name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm lint` isn't run here yet: the repo currently has ~143
      # pre-existing eslint errors outside today's changes (mcp-server/,
      # lib/seo/, refactor.js, ...) that would make this gate fail on the
      # first commit. Add it back once that's cleaned up.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
